<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billys Portfolio</title>
  <link rel="stylesheet" href="Main.css">
</head>

<body>
  <video class="video-background" src="videos/gold-flakes.mp4" autoplay loop muted playsinline></video>
  <!-- Navigation header -->
  <header>
    <nav class="navbar">
      <ul class="nav-left">
        <li>
          <img src="images/Home.png" alt="Home-icon"><a href="Index.html">Hem</a>
        </li>
        <li>
          <img class="Projects-img" src="images/Projects.png" alt="Projects icon"><a href="Projects.html">Projekt</a>
        </li>
        <li>
          <img src="images/Gallery.png" alt="Gallery icon"><a href="Gallery.html">Galleri</a>
        </li>
      </ul>
      <div class="nav-center">
        <img src="images/Portrait-gold.png" alt="Portrait">
        <span>Billy Lindström</span>
      </div>
      <ul class="nav-right">
        <li class="active">
          <img src="images/Contact-black.png" alt="Contact icon"><a href="Contact.html">Kontakt</a>
        </li>
      </ul>
    </nav>
  </header>
  <!-- Main content -->
  <main>
    <div class="contact-container">
      <!-- Page title -->
      <section class="contact-title">
        <h1>Kontakt</h1>
      </section>
      <!-- Contact form -->
      <form class="contact-form" method="post" novalidate>
        <!-- Left column with message textarea -->
        <div class="form-left">
          <label class="sr-only" for="Message">Meddelande</label>
          <textarea name="Message" id="Message" placeholder="Meddelande..." rows="8"></textarea>
        </div>
        <!-- Right column with subject, name, email fields and send button -->
        <div class="form-right">
          <div>
            <label class="sr-only" for="Subject">Ämne</label>
            <select name="Subject" id="Subject">
              <option value="" disabled selected>Välj ett ämne...</option>
              <option value="Job Opportunity">Jobbmöjlighet</option>
              <option value="Project Collaboration">Samarbete kring projekt</option>
              <option value="Other">Annat</option>
            </select>
          </div>
          <div class="name-fields">
            <div class="name-field">
              <label class="sr-only" for="FirstName">Namn</label>
              <input type="text" name="FirstName" id="FirstName" placeholder="Förnamn...">
            </div>
            <div class="name-field">
              <label class="sr-only" for="LastName">Efternamn</label>
              <input type="text" name="LastName" id="LastName" placeholder="Efternamn...">
            </div>
          </div>
          <div>
            <label class="sr-only" for="Email">Email</label>
            <input type="email" name="Email" id="Email" placeholder="Email...">
          </div>
          <label class="sr-only" for="Phonenumber">Telefonnummer</label>
          <input type="tel" name="Phonenumber" id="Phonenumber" placeholder="Telefonnummer...">
          <div class="button-group">
            <button type="button" class="clear-btn">Rensa</button>
            <button type="submit" class="send-btn">Skicka</button>
          </div>
        </div>
      </form>
    </div>
  </main>
  <!-- Footer section -->
  <footer>
    <div class="footer-content">
      <div class="footer-left">
        <h3>Billy Lindström</h3>
        <p>Digital Designer</p>
      </div>
      <div class="footer-social">
        <a href="https://github.com/Billywebdev" target="_blank">
          <img src="images/github-icon.png" alt="GitHub icon">GitHub
        </a>
        <a href="https://linkedin.com" target="_blank">
          <img src="images/linkedin-icon.png" alt="LinkedIn icon">LinkedIn
        </a>
        <a href="mailto:contact@example.com">
          <img src="images/email-icon.png" alt="Email icon">Email
        </a>
      </div>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-bottom">
      <p>&copy; 2025 Billy Lindström. Alla rättigheter förbehållna.</p>
    </div>
  </footer>
  <script src="Main.js"></script>
</body>

</html>
